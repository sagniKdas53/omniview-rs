[package]
name = "omniview"
version = "1.0.0"
edition = "2021"
description = "Fast, generic desktop image viewer with WebP caching and live watching"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
webp = "0.3"
walkdir = "2.5"
notify = "8.2"
rayon = "1.12"
crossbeam-channel = "0.5"
arboard = "3.6"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
