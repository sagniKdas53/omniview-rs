[package]
name = "omniview-rs"
version = "1.0.0"
edition = "2021"
description = "OmniView RS - Standalone high-performance image gallery viewer in Rust"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
webp = "0.3"
walkdir = "2.5"
notify = "8.2"
rayon = "1.12"
crossbeam-channel = "0.5"
arboard = "3.6"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
libc = "0.2"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
cc = "1.4.5"
